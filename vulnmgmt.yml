---
# Vulnerability management platform (assignment item 5).
#
# Runs on the Wazuh server itself (group wazuh_server); n8n runs there in Docker:
#   bootstrap.sh --component vulnmgmt
#   ansible-playbook -i inventory/hosts.ini vulnmgmt.yml -l wazuh_server -e vulnmgmt_indexer_admin_password=...
# Unused alternative: another server (group vulnmgmt_server) that reads the
# Wazuh indexer over the network, with -e vulnmgmt_wazuh_host=<wazuh-ip>.
- name: Vulnerability management platform
  hosts: vulnmgmt_server:wazuh_server
  become: true
  gather_facts: true
  roles:
    - role: vulnmgmt
