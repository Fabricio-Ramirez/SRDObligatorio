# Used by bootstrap.sh: the playbook hardens the machine it runs on.
# /usr/bin/python3 is the platform Python (3.9) that has the dnf, selinux and
# firewalld bindings; ansible-core itself may run on a newer Python.
[rocky_servers]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# The vulnerability management platform (vulnmgmt.yml) runs on the Wazuh server.
[wazuh_server]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
