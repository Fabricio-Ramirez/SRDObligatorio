---
- name: CIS 1.2.1.2 | Ensure gpgcheck is globally activated
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^\s*gpgcheck\s*='
    line: gpgcheck=1
    insertafter: '^\[main\]'

- name: CIS 1.2.1.2 | Find repository definitions
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "*.repo"
  register: hardening_repo_files

- name: CIS 1.2.1.2 | Ensure no repository disables gpgcheck
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(\s*gpgcheck\s*=\s*)0\s*$'
    replace: '\g<1>1'
  loop: "{{ hardening_repo_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: CIS 1.2.2.1 | Ensure updates and security patches are installed
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
    security: "{{ hardening_updates_security_only | bool }}"
  when: hardening_apply_updates | bool

- name: CIS 2.1 / 2.2 | Ensure unneeded server services and clients are not installed
  ansible.builtin.dnf:
    name: "{{ hardening_packages_absent | difference(hardening_packages_keep) }}"
    state: absent

- name: CIS 1.2.2.1 | Ensure dnf-automatic is installed
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  when: hardening_dnf_automatic | bool

- name: CIS 1.2.2.1 | Configure dnf-automatic to apply security updates
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    insertafter: '^\[commands\]'
  loop:
    - { key: upgrade_type, value: security }
    - { key: apply_updates, value: "yes" }
  loop_control:
    label: "{{ item.key }}"
  when: hardening_dnf_automatic | bool

- name: CIS 1.2.2.1 | Ensure the dnf-automatic timer is enabled
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
  when: hardening_dnf_automatic | bool

- name: CIS 1.2.2.1 | Ensure dnf-plugins-core (needs-restarting) is installed
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: CIS 1.2.2.1 | Check whether a reboot is needed to use updated packages
  ansible.builtin.command: dnf needs-restarting --reboothint
  register: hardening_needs_restarting
  changed_when: false
  failed_when: hardening_needs_restarting.rc not in [0, 1]
  check_mode: false

- name: CIS 1.2.2.1 | Flag reboot for updated core packages
  ansible.builtin.set_fact:
    hardening_reboot_reasons: "{{ hardening_reboot_reasons + ['Updated kernel/core libraries (dnf needs-restarting)'] }}"
  when:
    - hardening_needs_restarting.rc == 1
    - "'Reboot is required' in hardening_needs_restarting.stdout"
