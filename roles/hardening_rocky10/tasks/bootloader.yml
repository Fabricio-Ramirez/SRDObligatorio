---
- name: Bootloader | Ensure grubby is installed
  ansible.builtin.dnf:
    name: grubby
    state: present

# --- Kernel command line (BLS entries + /etc/default/grub) -------------------
- name: CIS 1.3.1.2 / 6.3.1.2-3 | Read the kernel arguments of every boot entry
  ansible.builtin.command: grubby --info=ALL
  register: hardening_grubby_info
  changed_when: false
  check_mode: false

- name: CIS 1.3.1.2 / 6.3.1.2-3 | Parse boot entry arguments
  ansible.builtin.set_fact:
    hardening_boot_entries_args: >-
      {{ hardening_grubby_info.stdout | regex_findall('(?m)^args="(.*)"$') | map('split') | list }}

- name: CIS 6.3.1.2-3 | Ensure audit=1 and audit_backlog_limit are set on every boot entry
  ansible.builtin.command: "grubby --update-kernel=ALL --args={{ item }}"
  loop: "{{ hardening_kernel_args_present }}"
  when: hardening_boot_entries_args | reject('contains', item) | list | length > 0
  register: hardening_grubby_add
  changed_when: true

- name: CIS 1.3.1.2 | Ensure SELinux is not disabled in the bootloader configuration
  ansible.builtin.command: "grubby --update-kernel=ALL --remove-args={{ item }}"
  loop: "{{ hardening_kernel_args_absent }}"
  when: hardening_boot_entries_args | select('contains', item) | list | length > 0
  register: hardening_grubby_remove
  changed_when: true

- name: Bootloader | Read /etc/default/grub
  ansible.builtin.slurp:
    src: /etc/default/grub
  register: hardening_default_grub

# Keeps future kernels consistent: their entries are built from GRUB_CMDLINE_LINUX.
- name: CIS 1.3.1.2 / 6.3.1.2-3 | Ensure GRUB_CMDLINE_LINUX has the same arguments
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="{{ (_kept + hardening_kernel_args_present) | join(" ") }}"'
  vars:
    _current: >-
      {{ hardening_default_grub.content | b64decode
         | regex_findall('(?m)^GRUB_CMDLINE_LINUX="(.*)"$') | first | default('') | split }}
    _managed_keys: >-
      ^({{ hardening_kernel_args_present | map('regex_replace', '=.*$', '') | map('regex_escape') | join('|') }})(=|$)
    _kept: >-
      {{ _current | reject('in', hardening_kernel_args_absent) | reject('match', _managed_keys) | list }}
  when: hardening_kernel_args_present | length > 0

- name: Bootloader | Flag reboot for kernel command line changes
  ansible.builtin.set_fact:
    hardening_reboot_reasons: "{{ hardening_reboot_reasons + ['Kernel command line changed (grubby)'] }}"
  when: hardening_grubby_add is changed or hardening_grubby_remove is changed

# --- 1.4 Bootloader protection -----------------------------------------------
- name: CIS 1.4.1 | Ensure bootloader password is set
  ansible.builtin.copy:
    dest: /boot/grub2/user.cfg
    content: "GRUB2_PASSWORD={{ hardening_grub_password_pbkdf2 }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: hardening_grub_password_pbkdf2 | length > 0

- name: CIS 1.4.1 | Report missing bootloader password
  ansible.builtin.set_fact:
    hardening_warnings: "{{ hardening_warnings + ['CIS 1.4.1: no GRUB2 password configured (set hardening_grub_password_pbkdf2)'] }}"
  when: hardening_grub_password_pbkdf2 | length == 0

- name: CIS 1.4.2 | Find bootloader configuration files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /boot/grub2/grub.cfg
    - /boot/grub2/grubenv
    - /boot/grub2/user.cfg
  register: hardening_grub_files

- name: CIS 1.4.2 | Ensure access to bootloader config is configured
  ansible.builtin.file:
    path: "{{ item.item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ hardening_grub_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
