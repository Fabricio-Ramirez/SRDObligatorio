---
# n8n runs in Docker. Amazon Linux 2023 (the Wazuh server image) has docker in
# its default repositories; on Rocky Linux it comes from Docker's repository.
- name: n8n | Add the Docker repository (Rocky Linux)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "{{ vulnmgmt_docker_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ vulnmgmt_docker_repo_gpgkey }}"
    enabled: true
  when: ansible_facts['distribution'] != 'Amazon'

- name: n8n | Install Docker
  ansible.builtin.dnf:
    name: "{{ vulnmgmt_docker_packages }}"
    state: present

# Docker turns on net.ipv4.ip_forward when it starts, against the CIS hardening
# of the Rocky server (3.3.1.1). n8n uses the host network, so forwarding is not
# needed. Written only when the file does not exist (an existing one is kept).
- name: n8n | Ensure the Docker configuration directory exists (Rocky Linux)
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts['distribution'] != 'Amazon'

- name: n8n | Keep IP forwarding off in Docker (Rocky Linux)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {"ip-forward": false}
    owner: root
    group: root
    mode: "0644"
    force: false
  when: ansible_facts['distribution'] != 'Amazon'

- name: n8n | Ensure Docker is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# Earlier versions ran n8n with a Podman Quadlet unit: stop it (it holds port
# 5678) and remove it. The data in /var/lib/n8n is kept and reused.
- name: n8n | Look for an earlier Podman unit
  ansible.builtin.stat:
    path: /etc/containers/systemd/n8n.container
  register: vulnmgmt_n8n_quadlet

- name: n8n | Stop the earlier Podman unit
  ansible.builtin.systemd:
    name: n8n
    state: stopped
  when: vulnmgmt_n8n_quadlet.stat.exists
  failed_when: false

- name: n8n | Remove the earlier Podman unit
  ansible.builtin.file:
    path: /etc/containers/systemd/n8n.container
    state: absent

# n8n runs as uid 1000 ("node") inside the container.
- name: n8n | Create the data, import and certificate directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/n8n, owner: "1000", mode: "0700"}
    - {path: /var/lib/n8n/import, owner: "1000", mode: "0700"}
    - {path: /etc/vulnmgmt/n8n-ca, owner: root, mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

# The workflow reads the dashboard over HTTPS; n8n trusts its self-signed
# certificate through NODE_EXTRA_CA_CERTS.
- name: n8n | Provide the dashboard certificate to n8n
  ansible.builtin.copy:
    src: /etc/pki/tls/certs/vulnmgmt.crt
    dest: /etc/vulnmgmt/n8n-ca/vulnmgmt.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart n8n

# The flow embeds the prioritisation script (vulnmgmt/n8n/priorizar-soluciones.js),
# so the rendered file changes whenever that script changes - which is exactly
# when the workflow has to be imported again.
- name: n8n | Render the workflow with the prioritisation script
  ansible.builtin.template:
    src: vulnmgmt-workflow.json.j2
    dest: /var/lib/n8n/import/vulnmgmt-workflow.json
    owner: "1000"
    group: "1000"
    mode: "0600"
  register: vulnmgmt_n8n_workflow

- name: n8n | Install the n8n service (Docker)
  ansible.builtin.template:
    src: n8n.service.j2
    dest: /etc/systemd/system/n8n.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart n8n

# The first start pulls the image (TimeoutStartSec=300 in the unit).
- name: n8n | Ensure n8n is enabled and running
  ansible.builtin.systemd:
    name: n8n
    enabled: true
    state: started
    daemon_reload: true

- name: n8n | Wait for n8n
  ansible.builtin.uri:
    url: http://127.0.0.1:5678/healthz
  register: vulnmgmt_n8n_health
  retries: 30
  delay: 10
  until: vulnmgmt_n8n_health.status == 200

# The workflow carries a fixed id ("vulnmgmtWeekly01"), so importing it again
# updates the existing flow instead of leaving a duplicate behind. Changes made
# by hand in the editor are overwritten: the repository is the source of truth.
#
# The marker is named after the checksum of the rendered file, so the import
# runs once per version *and* is retried on the next run if it failed: the
# marker is only written after the import succeeds.
- name: n8n | Import the vulnerability workflow (once per version, retried on failure)
  ansible.builtin.command: docker exec n8n n8n import:workflow --input=/home/node/.n8n/import/vulnmgmt-workflow.json
  args:
    creates: "/var/lib/n8n/import/.imported-{{ vulnmgmt_n8n_workflow.checksum | default('unknown') }}"

- name: n8n | Remember which version of the workflow was imported
  ansible.builtin.copy:
    dest: "/var/lib/n8n/import/.imported-{{ vulnmgmt_n8n_workflow.checksum | default('unknown') }}"
    content: "imported\n"
    owner: "1000"
    group: "1000"
    mode: "0600"

- name: n8n | List the import markers
  ansible.builtin.find:
    paths: /var/lib/n8n/import
    patterns: ".imported*"
    hidden: true
  register: vulnmgmt_n8n_markers

# Leaves only the marker of the version just imported (this also removes the
# ".imported" marker that earlier versions of this role used).
- name: n8n | Drop the markers of previous versions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vulnmgmt_n8n_markers.files }}"
  when: (item.path | basename) != ('.imported-' ~ (vulnmgmt_n8n_workflow.checksum | default('unknown')))
  loop_control:
    label: "{{ item.path }}"
