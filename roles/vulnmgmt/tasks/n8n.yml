---
# Quadlet (the .container units below) needs Podman 4.4 or newer.
- name: n8n | Read the Podman version
  ansible.builtin.command: podman --version
  register: vulnmgmt_podman_version
  changed_when: false
  check_mode: false

- name: n8n | Require a Podman with Quadlet support
  ansible.builtin.assert:
    that: (vulnmgmt_podman_version.stdout | regex_search('[0-9]+(\.[0-9]+)+')) is version('4.4', '>=')
    fail_msg: >-
      n8n needs Podman 4.4 or newer (Quadlet); found "{{ vulnmgmt_podman_version.stdout }}".
      Install the rest without it with -e vulnmgmt_n8n_enabled=false.
    quiet: true

# n8n runs as uid 1000 ("node") inside the container.
- name: n8n | Create the data, import and certificate directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/n8n, owner: "1000", mode: "0700"}
    - {path: /var/lib/n8n/import, owner: "1000", mode: "0700"}
    - {path: /etc/vulnmgmt/n8n-ca, owner: root, mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

# The workflow reads the dashboard over HTTPS; n8n trusts its self-signed
# certificate through NODE_EXTRA_CA_CERTS.
- name: n8n | Provide the dashboard certificate to n8n
  ansible.builtin.copy:
    src: /etc/pki/tls/certs/vulnmgmt.crt
    dest: /etc/vulnmgmt/n8n-ca/vulnmgmt.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart n8n

# The flow embeds the prioritisation script (vulnmgmt/n8n/priorizar-soluciones.js),
# so the rendered file changes whenever that script changes - which is exactly
# when the workflow has to be imported again.
- name: n8n | Render the workflow with the prioritisation script
  ansible.builtin.template:
    src: vulnmgmt-workflow.json.j2
    dest: /var/lib/n8n/import/vulnmgmt-workflow.json
    owner: "1000"
    group: "1000"
    mode: "0600"
  register: vulnmgmt_n8n_workflow

- name: n8n | Install the container (Podman Quadlet)
  ansible.builtin.template:
    src: n8n.container.j2
    dest: /etc/containers/systemd/n8n.container
    owner: root
    group: root
    mode: "0644"
  notify: Restart n8n

# Quadlet generates n8n.service at daemon-reload; it is started from its
# [Install] section and cannot be "enabled" with systemctl.
- name: n8n | Ensure n8n is running
  ansible.builtin.systemd:
    name: n8n
    state: started
    daemon_reload: true

- name: n8n | Wait for n8n
  ansible.builtin.uri:
    url: http://127.0.0.1:5678/healthz
  register: vulnmgmt_n8n_health
  retries: 30
  delay: 10
  until: vulnmgmt_n8n_health.status == 200

# The workflow carries a fixed id ("vulnmgmtWeekly01"), so importing it again
# updates the existing flow instead of leaving a duplicate behind. Changes made
# by hand in the editor are overwritten: the repository is the source of truth.
#
# The marker is named after the checksum of the rendered file, so the import
# runs once per version *and* is retried on the next run if it failed: the
# marker is only written after the import succeeds.
- name: n8n | Import the vulnerability workflow (once per version, retried on failure)
  ansible.builtin.command: podman exec n8n n8n import:workflow --input=/home/node/.n8n/import/vulnmgmt-workflow.json
  args:
    creates: "/var/lib/n8n/import/.imported-{{ vulnmgmt_n8n_workflow.checksum | default('unknown') }}"

- name: n8n | Remember which version of the workflow was imported
  ansible.builtin.copy:
    dest: "/var/lib/n8n/import/.imported-{{ vulnmgmt_n8n_workflow.checksum | default('unknown') }}"
    content: "imported\n"
    owner: "1000"
    group: "1000"
    mode: "0600"

- name: n8n | List the import markers
  ansible.builtin.find:
    paths: /var/lib/n8n/import
    patterns: ".imported*"
    hidden: true
  register: vulnmgmt_n8n_markers

# Leaves only the marker of the version just imported (this also removes the
# ".imported" marker that earlier versions of this role used).
- name: n8n | Drop the markers of previous versions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vulnmgmt_n8n_markers.files }}"
  when: (item.path | basename) != ('.imported-' ~ (vulnmgmt_n8n_workflow.checksum | default('unknown')))
  loop_control:
    label: "{{ item.path }}"
