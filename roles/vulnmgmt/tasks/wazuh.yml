---
- name: SIEM | Install the vulnerability management rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/vulnmgmt/wazuh/vulnmgmt_rules.xml"
    dest: /var/ossec/etc/rules/vulnmgmt_rules.xml
    owner: wazuh
    group: wazuh
    mode: "0660"
  register: vulnmgmt_rules_file

- name: SIEM | Read the engine events with the Wazuh manager
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED BLOCK: vulnmgmt -->"
    insertafter: EOF
    block: |
      <ossec_config>
        <localfile>
          <log_format>json</log_format>
          <location>/var/log/vulnmgmt/events.json</location>
        </localfile>
      </ossec_config>
  register: vulnmgmt_ossec_conf

# A broken rule or ossec.conf would stop the manager: test before restarting.
- name: SIEM | Validate the manager configuration and rules
  ansible.builtin.command: /var/ossec/bin/wazuh-analysisd -t
  changed_when: vulnmgmt_rules_file is changed or vulnmgmt_ossec_conf is changed
  notify: Restart wazuh-manager
