---
- name: Preflight | Check the operating system
  ansible.builtin.assert:
    that: >-
      vulnmgmt_allow_untested_platform | bool or
      ansible_facts['distribution_major_version'] in
      (vulnmgmt_supported_platforms | selectattr('distribution', 'equalto', ansible_facts['distribution'])
       | map(attribute='versions') | flatten | list)
    fail_msg: >-
      vulnmgmt supports {{ _platforms }}; found {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}. Set vulnmgmt_allow_untested_platform=true to try another
      dnf-based distribution at your own risk.
    quiet: true
  vars:
    _platforms: >-
      {% for p in vulnmgmt_supported_platforms %}{{ p.distribution }} {{ p.versions | join('/') }}{% if not loop.last %}, {% endif %}{% endfor %}

- name: Preflight | Check the Python version used by the engine
  ansible.builtin.assert:
    that: ansible_facts['python_version'] is version(vulnmgmt_min_python, '>=')
    fail_msg: >-
      The engine needs Python {{ vulnmgmt_min_python }} or newer; this server's python3 is
      {{ ansible_facts['python_version'] }} (Amazon Linux 2 ships Python 3.7: use Amazon Linux 2023).
    quiet: true

- name: Preflight | Look for the Wazuh manager
  ansible.builtin.stat:
    path: /var/ossec/bin/wazuh-control
  register: vulnmgmt_wazuh_control

- name: Preflight | Abort if this is not the Wazuh server
  ansible.builtin.assert:
    that: vulnmgmt_wazuh_control.stat.exists
    fail_msg: >-
      This playbook must run on the Wazuh server (manager + indexer). /var/ossec/bin/wazuh-control was not found.
    quiet: true

- name: Preflight | Look for an existing reader secret
  ansible.builtin.stat:
    path: /etc/vulnmgmt/indexer.secret
  register: vulnmgmt_reader_secret

- name: Preflight | Check the indexer credentials
  ansible.builtin.assert:
    that: >-
      (vulnmgmt_indexer_create_reader | bool and
       (vulnmgmt_indexer_admin_password | length > 0 or vulnmgmt_reader_secret.stat.exists))
      or (not (vulnmgmt_indexer_create_reader | bool) and vulnmgmt_indexer_password | length > 0)
    fail_msg: >-
      Indexer credentials are missing. Pass the indexer admin password once
      (-e vulnmgmt_indexer_admin_password=... ; it is in wazuh-passwords.txt inside
      wazuh-install-files.tar) so the role can create the read-only user, or set
      vulnmgmt_indexer_create_reader=false with vulnmgmt_indexer_user/password.
    quiet: true

- name: Preflight | Report a VM that is small for the local AI
  ansible.builtin.debug:
    msg: >-
      This server has {{ ansible_facts['memtotal_mb'] }} MB of RAM. Wazuh all-in-one needs about 8 GB;
      the local AI adds 1-2 GB while it runs. The engine skips the AI automatically when there is not
      enough free memory, or disable it with -e vulnmgmt_ai_enabled=false.
  when:
    - vulnmgmt_ai_enabled | bool
    - ansible_facts['memtotal_mb'] < 9000

# n8n runs as a Podman Quadlet unit. Some supported platforms (for example the
# Wazuh OVA on Amazon Linux 2023) ship no podman package at all, and without
# this check the run fails later, during package installation, with a bare dnf
# error that says nothing about n8n.
- name: Preflight | Look for Podman (required by the n8n workflows)
  ansible.builtin.command: command -v podman
  register: vulnmgmt_podman_found
  changed_when: false
  failed_when: false
  check_mode: false
  when: vulnmgmt_n8n_enabled | bool

- name: Preflight | Check whether Podman can be installed
  ansible.builtin.command: dnf -q list --available podman
  register: vulnmgmt_podman_available
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - vulnmgmt_n8n_enabled | bool
    - vulnmgmt_podman_found.rc != 0

- name: Preflight | Skip the no-code workflows when Podman is unavailable
  ansible.builtin.set_fact:
    vulnmgmt_n8n_enabled: false
  when:
    - vulnmgmt_n8n_enabled | bool
    - vulnmgmt_podman_found.rc != 0
    - vulnmgmt_podman_available.rc != 0

- name: Preflight | Report that the no-code workflows were skipped
  ansible.builtin.debug:
    msg: >-
      Podman is not installed and is not available in the configured repositories, so the
      n8n workflows were skipped. Everything else installs normally. To add them later,
      install Podman 4.4 or newer and run again, or host n8n on another machine pointing
      it at the reports this engine publishes.
  when:
    - not (vulnmgmt_n8n_enabled | bool)
    - vulnmgmt_podman_found is defined
    - vulnmgmt_podman_found.rc is defined
    - vulnmgmt_podman_found.rc != 0
