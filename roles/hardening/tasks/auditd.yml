---
# System auditing is CIS Level 2, but it is a mandatory control of the
# assignment ("Auditoría del sistema"), so the full 6.3 section is applied.
# Kernel arguments audit=1 / audit_backlog_limit (6.3.1.2-3) are set in bootloader.yml.

- name: CIS 6.3.1.1 | Ensure auditd packages are installed
  ansible.builtin.dnf:
    name:
      - audit
      - audit-libs
    state: present

- name: CIS 6.3.1.4 | Ensure auditd service is enabled and active
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# --- 6.3.2 Data retention -----------------------------------------------------
- name: CIS 6.3.2.1-6.3.2.4 | Configure audit log storage and disk space actions
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ hardening_auditd_conf | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  notify: Reload auditd

# --- 6.3.3 Rules ----------------------------------------------------------------
- name: CIS 6.3.3 | Read the running audit status
  ansible.builtin.command: auditctl -s
  register: hardening_auditctl_status
  changed_when: false
  check_mode: false

- name: CIS 6.3.3.20 | Detect whether the running rules are already immutable
  ansible.builtin.set_fact:
    hardening_audit_running_immutable: "{{ hardening_auditctl_status.stdout is search('(?m)^enabled 2$') }}"

- name: CIS 6.3.3 | Read the syscall table of this architecture
  ansible.builtin.command: ausyscall --dump
  register: hardening_ausyscall_b64
  changed_when: false
  check_mode: false

- name: CIS 6.3.3 | Read the 32-bit syscall table (x86_64 only)
  ansible.builtin.command: ausyscall i386 --dump
  register: hardening_ausyscall_b32
  changed_when: false
  check_mode: false
  when: ansible_facts['architecture'] == 'x86_64'

# "ausyscall --dump" prints "<number>\t<name>" lines.
- name: CIS 6.3.3 | Build the syscall name list per audit architecture
  ansible.builtin.set_fact:
    hardening_audit_arches: >-
      {{ {'b64': _b64}
         | combine({'b32': _b32} if ansible_facts['architecture'] == 'x86_64' else {}) }}
  vars:
    _b64: "{{ hardening_ausyscall_b64.stdout_lines | select('match', '^[0-9]+\\s') | map('split') | map('last') | list }}"
    _b32: "{{ (hardening_ausyscall_b32.stdout_lines | default([])) | select('match', '^[0-9]+\\s') | map('split') | map('last') | list }}"

- name: CIS 6.3.3 | Check that the syscall tables were parsed
  ansible.builtin.assert:
    that: "'execve' in item.value"
    fail_msg: "Could not parse 'ausyscall' output for {{ item.key }}"
    quiet: true
  loop: "{{ hardening_audit_arches | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: CIS 6.3.3.6 | Find setuid/setgid programs on local file systems
  ansible.builtin.command: >-
    find {{ _mounts | join(' ') }} -xdev -type f ( -perm -4000 -o -perm -2000 )
  vars:
    _mounts: >-
      {{ (['/'] + (ansible_facts['mounts']
         | selectattr('fstype', 'in', ['xfs', 'ext4', 'ext3', 'btrfs'])
         | rejectattr('options', 'search', 'nosuid|noexec')
         | map(attribute='mount') | list)) | unique }}
  register: hardening_suid_find
  changed_when: false
  failed_when: hardening_suid_find.stdout_lines | length == 0
  check_mode: false

- name: CIS 6.3.3.6 | Record the privileged programs
  ansible.builtin.set_fact:
    hardening_audit_privileged_programs: "{{ hardening_suid_find.stdout_lines | unique | sort }}"

- name: CIS 6.3.3.1-6.3.3.19 | Deploy the audit rules
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/audit/rules.d/{{ item.dest }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - { src: audit-cis.rules.j2, dest: 50-cis-hardening.rules }
    - { src: audit-privileged.rules.j2, dest: 50-cis-privileged.rules }
  loop_control:
    label: "{{ item.dest }}"
  register: hardening_audit_rules
  notify: Load audit rules

- name: CIS 6.3.3.20 | Ensure the audit configuration is immutable
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-finalize.rules
    content: |
      ## {{ hardening_managed_comment }}
      ## CIS 6.3.3.20 - rules can only be changed after a reboot
      -e 2
    owner: root
    group: root
    mode: "0640"
  register: hardening_audit_finalize
  notify: Load audit rules
  when: hardening_audit_immutable | bool

- name: CIS 6.3.3.20 | Ensure the audit configuration is not immutable
  ansible.builtin.file:
    path: /etc/audit/rules.d/99-finalize.rules
    state: absent
  register: hardening_audit_finalize_removed
  notify: Load audit rules
  when: not (hardening_audit_immutable | bool)

- name: CIS 6.3.3.21 | Flag reboot when new rules cannot be loaded (immutable mode)
  ansible.builtin.set_fact:
    hardening_reboot_reasons: "{{ hardening_reboot_reasons + ['Audit rules changed while the kernel rules are immutable (-e 2)'] }}"
  when:
    - hardening_audit_running_immutable | bool
    - hardening_audit_rules is changed or hardening_audit_finalize is changed or hardening_audit_finalize_removed is changed

# --- 6.3.4 File access ---------------------------------------------------------
# CIS 6.3.4 asks for "this mode or more restrictive": symbolic modes only
# remove permissions, they never loosen a stricter file.
- name: CIS 6.3.4.1 | Ensure the audit log directory mode is 0750 or more restrictive
  ansible.builtin.file:
    path: /var/log/audit
    state: directory
    owner: root
    group: root
    mode: "g-w,o-rwx"

- name: CIS 6.3.4.2-6.3.4.4 | Find audit log files
  ansible.builtin.find:
    paths: /var/log/audit
    patterns: "audit.log*"
  register: hardening_audit_logs

- name: CIS 6.3.4.2-6.3.4.4 | Ensure audit log files are 0640 or more restrictive, owned by root
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "u-x,g-wx,o-rwx"
  loop: "{{ hardening_audit_logs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: CIS 6.3.4.5-6.3.4.7 | Find audit configuration files
  ansible.builtin.find:
    paths: [/etc/audit, /etc/audit/rules.d]
    patterns: ["*.conf", "*.rules"]
  register: hardening_audit_confs

- name: CIS 6.3.4.5-6.3.4.7 | Ensure audit configuration files are 0640 or more restrictive
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "u-x,g-wx,o-rwx"
  loop: "{{ hardening_audit_confs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: CIS 6.3.4.8-6.3.4.10 | Ensure audit tools are 0755 or more restrictive, owned by root
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "go-w"
  loop: "{{ hardening_aide_audit_tools }}"
